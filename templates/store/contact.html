{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<section class="mx-auto max-w-4xl px-4 py-20 lg:px-8">
  <div class="fade-section visible text-center">
    <h1 class="section-heading">Contact Us</h1>
    <div class="gold-divider"></div>
    <p class="text-brand-cream/60">We'd love to hear from you</p>
  </div>
  <div class="fade-section visible mt-12 grid gap-8 sm:grid-cols-2">
    <div class="border border-brand-gold/10 bg-brand-charcoal p-8 text-center">
      <h3 class="font-serif text-xl text-brand-gold">WhatsApp</h3>
      <p class="mt-4 text-brand-cream/70">Fastest way to reach us for orders & support</p>
      <a href="https://wa.me/{{ whatsapp_number }}" target="_blank" rel="noopener" class="btn-gold mt-6 inline-block">Chat on WhatsApp</a>
    </div>
    <div class="border border-brand-gold/10 bg-brand-charcoal p-8 text-center">
      <h3 class="font-serif text-xl text-brand-gold">Email</h3>
      <p class="mt-4 text-brand-cream/70">For general inquiries</p>
      <a href="mailto:hello@scentryryv.com" class="mt-6 inline-block text-brand-gold underline">hello@scentryryv.com</a>
    </div>
  </div>
</section>
{% endblock %}
