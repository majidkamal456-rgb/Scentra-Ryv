{% load static %}

<div class="product-card group flex flex-col">
  <a href="{{ product.get_absolute_url }}" class="relative block aspect-[3/4] overflow-hidden bg-gradient-to-b from-brand-charcoal to-brand-black">
    {% if product.image_main %}
      <img src="{{ product.image_main.url }}" alt="{{ product.name }}" class="h-full w-full object-cover transition duration-700 group-hover:scale-105">
    {% else %}
      <div class="flex h-full w-full flex-col items-center justify-center bg-gradient-to-br from-brand-charcoal via-brand-black to-brand-charcoal">
        <div class="mb-4 h-24 w-16 rounded-t-full border border-brand-gold/30 bg-gradient-to-b from-brand-gold/20 to-transparent"></div>
        <span class="font-serif text-lg text-brand-gold/60">{{ product.name }}</span>
      </div>
    {% endif %}
    <span class="absolute left-3 top-3 bg-brand-black/80 px-2 py-1 text-[10px] uppercase tracking-widest text-brand-gold">{{ product.gender }}</span>
  </a>
  <div class="flex flex-1 flex-col p-5">
    <a href="{{ product.get_absolute_url }}">
      <h3 class="font-serif text-xl text-brand-cream transition hover:text-brand-gold">{{ product.name }}</h3>
    </a>
    <p class="mt-1 text-sm text-brand-cream/50">{{ product.short_description|truncatewords:10 }}</p>
    <p class="mt-3 font-serif text-lg text-brand-gold">Rs. {{ product.price|floatformat:0 }}</p>
    <div class="mt-auto flex gap-2 pt-4">
      <form method="post" action="{% url 'store:cart_add' %}" data-cart-add data-ajax class="flex-1">
        {% csrf_token %}
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="size" value="{{ product.size_ml }}">
        <button type="submit" class="btn-gold w-full py-2 text-xs">Add to Cart</button>
      </form>
      <button data-quick-view="{% url 'store:quick_view' product.slug %}" class="btn-gold px-4 py-2 text-xs">Quick View</button>
    </div>
  </div>
</div>
