{% load static %}

<article class="product-card group">
  <a href="{{ product.get_absolute_url }}" class="product-card__media">
    {% if product.image_main %}
      <img src="{{ product.image_main.url }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
      <div class="flex h-full w-full flex-col items-center justify-center bg-gradient-to-br from-brand-charcoal via-brand-black to-brand-ink">
        <div class="mb-4 h-24 w-16 rounded-t-full border border-brand-gold/30 bg-gradient-to-b from-brand-gold/25 to-transparent"></div>
        <span class="font-serif text-lg text-brand-gold/55">{{ product.name }}</span>
      </div>
    {% endif %}
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-brand-black/70 via-transparent to-transparent opacity-80"></div>
    <span class="product-card__badge">{{ product.gender }}</span>
  </a>
  <div class="flex flex-1 flex-col px-5 pb-5 pt-4">
    <a href="{{ product.get_absolute_url }}" class="group/title">
      <h3 class="font-serif text-xl text-brand-cream transition group-hover/title:text-brand-gold">{{ product.name }}</h3>
    </a>
    <p class="mt-1.5 line-clamp-2 text-sm leading-relaxed text-brand-mute">{{ product.short_description|truncatewords:12 }}</p>
    <p class="mt-3 font-serif text-xl text-brand-gold">Rs. {{ product.price|floatformat:0 }}</p>
    <div class="mt-auto flex gap-2 pt-5">
      <form method="post" action="{% url 'store:cart_add' %}" data-cart-add data-ajax class="flex-1">
        {% csrf_token %}
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="size" value="{{ product.size_ml }}">
        <button type="submit" class="btn-gold w-full !px-3 !py-2.5 text-[10px]">Add to Cart</button>
      </form>
      <button type="button" data-quick-view="{% url 'store:quick_view' product.slug %}" class="btn-gold !px-3 !py-2.5 text-[10px]">Quick View</button>
    </div>
  </div>
</article>
